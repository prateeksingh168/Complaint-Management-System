<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Ticket | ComplaintCare</title>

  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />

  <style>
    .track-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .track-grid {
        grid-template-columns: 1fr;
      }
    }

    .card-box {
      background: #fff;
      border-radius: 16px;
      padding: 22px;
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.05);
      border: 1px solid #f1f5f9;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .search-row input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      font-size: 0.9rem;
    }

    .search-row input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .search-row button {
      padding: 12px 20px;
      background: linear-gradient(135deg, #0f172a, #14325c);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-row button:hover {
      opacity: 0.92;
    }

    .ticket-item {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.2s;
      background: #fff;
    }

    .ticket-item:hover,
    .ticket-item.active {
      border-color: #10b981;
      background: #f0fdf4;
    }

    .ticket-item h4 {
      font-family: "Outfit", sans-serif;
      font-size: 0.95rem;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .ticket-item p {
      font-size: 0.8rem;
      color: #64748b;
      margin: 0;
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-right: 4px;
    }

    .badge-urgent {
      background: #fee2e2;
      color: #b91c1c;
    }

    .badge-high {
      background: #ffedd5;
      color: #c2410c;
    }

    .badge-medium {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-low {
      background: #dcfce7;
      color: #166534;
    }

    .badge-status {
      background: #e0f2fe;
      color: #0369a1;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.88rem;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #64748b;
      font-weight: 600;
    }

    .detail-value {
      color: #0f172a;
      font-weight: 700;
      text-align: right;
    }

    .timeline {
      margin-top: 22px;
    }

    .t-step {
      display: flex;
      gap: 14px;
      margin-bottom: 16px;
      align-items: flex-start;
    }

    .dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 3px;
      background: #e2e8f0;
    }

    .dot.done {
      background: #10b981;
    }

    .dot.current {
      background: #0f172a;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
    }

    .t-line b {
      color: #0f172a;
      font-family: "Outfit", sans-serif;
      font-size: 0.9rem;
    }

    .t-line small {
      display: block;
      color: #64748b;
      font-size: 0.75rem;
      margin-top: 3px;
    }

    .loading {
      padding: 20px;
      color: #64748b;
      text-align: center;
    }

    .error-message {
      padding: 20px;
      color: #ef4444;
      text-align: center;
    }

    .success-message {
      padding: 20px;
      color: #059669;
      text-align: center;
    }
  </style>
</head>

<body style="
    background: linear-gradient(180deg, #f8fafc, #f1f5f9);
    min-height: 100vh;
  ">

    <!-- ================= SIDEBAR ================= -->

    ">

        margin-bottom:16px;
        display:flex;
        align-items:center;

      ">
        <img src="../assets/images/logo.png" alt="Logo" style="width:36px;height:36px;border-radius:8px;"
          onerror="this.style.display='none';" />

        <span style="
          font-family:'Outfit',sans-serif;
          font-weight:800;
          font-size:1.15rem;
          color:#fff;
        ">
          Complaint<span style="color:#34d399;">Care</span>
        </span>
      </div>

      <ul style="list-style:none;padding:0;">

        <li>

            display:flex;

            border-radius:10px;
            margin:2px 12px;
          ">
            <span>📊</span>
            Dashboard
          </a>
        </li>

        <li>
          <a href="complaint.html" style="
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px 24px;
            color:rgba(255,255,255,0.7);
            text-decoration:none;
            font-size:0.9rem;
            font-weight:600;
            border-radius:10px;
            margin:2px 12px;
          ">
            <span>📝</span>
            Log Complaint
          </a>
        </li>

        <li>
          <a href="ticket-tracking.html" style="
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px 24px;
            color:#fff;
            text-decoration:none;
            font-size:0.9rem;
            font-weight:700;
            background:rgba(255,255,255,0.08);
            border-radius:10px;
            margin:2px 12px;
          ">
            <span>📍</span>
            Track Ticket
          </a>
        </li>

        <li>
          <a href="notifications.html" style="
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px 24px;
            color:rgba(255,255,255,0.7);
            text-decoration:none;
            font-size:0.9rem;
            font-weight:600;

            margin:2px 12px;
          ">
            <span>🔔</span>
            Notifications
          </a>
        </li>

        <li>
          <a href="profile.html" style="
            display:flex;
            align-items:center;
            gap:12px;
            padding:12px 24px;
            color:rgba(255,255,255,0.7);
            text-decoration:none;
            font-size:0.9rem;

            border-radius:10px;

          ">

            Profile
          </a>
        </li>

      </ul>

      <div style="padding:16px 20px;">
        <button onclick="logout()" style="
          width:100%;
          padding:12px;
          background:rgba(239,68,68,0.15);
          color:#f87171;
          border:1px solid rgba(239,68,68,0.25);
          border-radius:10px;
          font-weight:700;
          cursor:pointer;
        ">
          🚪 Logout
        </button>
      </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <div style="margin-left:260px;flex:1;">

      <!-- TOPBAR -->

      <div style="
        background:rgba(255,255,255,0.9);
        backdrop-filter:blur(12px);
        padding:18px 32px;
        border-bottom:1px solid #e2e8f0;
        position:sticky;
        top:0;
        z-index:50;
        display:flex;
        justify-content:space-between;
        align-items:center;
      ">

        <div>

          <h2 style="
            font-family:'Outfit',sans-serif;
            color:#0f172a;
            font-size:1.2rem;
          ">
            📍 Track Ticket
          </h2>

          <p style="color:#64748b;font-size:0.85rem;">
            Ticket ID se search karo ya list se select karo
          </p>

        </div>

        <a href="notifications.html" style="
          position:relative;
          width:42px;
          height:42px;
          background:#f1f5f9;
          border-radius:12px;
          display:flex;
          align-items:center;
          justify-content:center;
          text-decoration:none;
        ">
          🔔

          <span id="notif-count" style="
            position:absolute;

            background:#ef4444;
            color:#fff;
            font-size:0.65rem;
            font-weight:800;
            width:18px;
            height:18px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
          ">

          </span>

        </a>

      </div>


      <!-- CONTENT -->

      <div style="padding:32px;">

        <div class="track-grid">

          <!-- ================= LEFT ================= -->

          <div class="card-box">

            <div class="search-row">

              <input id="searchId" type="text" placeholder="Ticket ID (e.g. TKT-10010)" />

              <button onclick="searchTicket()">
                Track
              </button>

            </div>

            <div id="ticketList">
              <div class="loading">
                Loading tickets...
              </div>
            </div>

          </div>


          <!-- ================= RIGHT ================= -->

          <div class="card-box" id="detailBox">

            <h3 style="
              font-family:'Outfit',sans-serif;
              color:#0f172a;
              margin-bottom:14px;
            ">
              Ticket Details
            </h3>

            <div style="padding:20px;color:#64748b;">
              Koi ticket select karo ya ID daal ke Track dabao.
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>


  <!-- ================= SCRIPTS ================= -->

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/chatbot.js"></script>


  <script>

    /* ============================================
       AUTH
    ============================================ */

    const user = checkAuth();

    if (!user) {
      window.location.href = "login.html";
    }


    /* ============================================
       CONSTANTS
    ============================================ */

    const STEPS = [
      "Registered",
      "In Progress",
      "Under Review",
      "Resolved"
    ];


    let userTickets = [];


    /* ============================================
       API REQUEST
    ============================================ */

    async function getBackendTickets() {

      return await apiRequest(
        "/tickets?page=1&page_size=100"
      );

    }


    /* ============================================
       PRIORITY CLASS
    ============================================ */

    function priorityClass(priority) {

      const value =
        String(priority || "Medium").toLowerCase();

      if (value === "urgent") {
        return "badge badge-urgent";
      }

      if (value === "high") {
        return "badge badge-high";
      }

      if (value === "low") {
        return "badge badge-low";
      }

      return "badge badge-medium";
    }


    /* ============================================
       STATUS CLASS
    ============================================ */

    function statusClass() {
      return "badge badge-status";
    }


    /* ============================================
       FORMAT DATE
    ============================================ */

    function formatDate(value) {

      if (!value) {
        return "N/A";
      }

      try {

        return new Date(value).toLocaleString();

      } catch {

        return "N/A";

      }

    }


    /* ============================================
       ESCAPE HTML
    ============================================ */

    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ============================================
       STATUS STEP
    ============================================ */

    function statusStep(status) {

      const index =
        STEPS.indexOf(status);

      return index === -1
        ? 0
        : index;

    }


    /* ============================================
       RENDER TICKET LIST
    ============================================ */

    function renderList(list) {

      const box =
        document.getElementById("ticketList");

      if (
        !list ||
        list.length === 0
      ) {

        box.innerHTML = `
        <div style="padding:20px;color:#64748b;">
          No tickets found.
        </div>
      `;

        return;
      }


      box.innerHTML =
        list.map(ticket => `

        <div
          class="ticket-item"
          onclick="showDetail(${ticket.id})"
        >

          <h4>
            ${escapeHtml(
          ticket.ticket_number || "N/A"
        )}
            —
            ${escapeHtml(
          ticket.complaint_id || "Complaint"
        )}
          </h4>

          <p>

            <span class="${priorityClass(ticket.priority)}">
              ${escapeHtml(
          ticket.priority || "Medium"
        )}
            </span>

            <span class="${statusClass(ticket.status)}">
              ${escapeHtml(
          ticket.status || "Registered"
        )}
            </span>

            &nbsp;

            ${escapeHtml(
          ticket.category || "General"
        )}

            •

            ${formatDate(
          ticket.created_at
        )}

          </p>

        </div>

      `).join("");

    }


    /* ============================================
       SHOW TICKET DETAILS
    ============================================ */

    async function showDetail(id) {

      const box =
        document.getElementById("detailBox");


      box.innerHTML = `
      <h3
        style="
          font-family:'Outfit',sans-serif;
          color:#0f172a;
          margin-bottom:14px;
        "
      >
        Ticket Details
      </h3>

      <div class="loading">
        Loading ticket details...
      </div>
    `;


      try {

        const ticket =
          await apiRequest(
            "/tickets/" + id
          );


        const current =
          statusStep(
            ticket.status || "Registered"
          );


        box.innerHTML = `

        <h3
          style="
            font-family:'Outfit',sans-serif;
            color:#0f172a;
            margin-bottom:6px;
          "
        >
          ${escapeHtml(
          ticket.ticket_number || "Ticket"
        )}
        </h3>


        <div
          style="
            margin-bottom:18px;
            color:#64748b;
          "
        >
          Complaint ID:
          <b style="color:#0f172a;">
            ${escapeHtml(
          ticket.complaint_id || "N/A"
        )}
          </b>
        </div>


        <div>

          <div class="detail-row">
            <span class="detail-label">
              Category
            </span>

            <span class="detail-value">
              ${escapeHtml(
          ticket.category || "N/A"
        )}
            </span>
          </div>


          <div class="detail-row">
            <span class="detail-label">
              Priority
            </span>

            <span class="detail-value">
              <span class="${priorityClass(ticket.priority)}">
                ${escapeHtml(
          ticket.priority || "Medium"
        )}
              </span>
            </span>
          </div>


          <div class="detail-row">
            <span class="detail-label">
              Status
            </span>

            <span class="detail-value">
              <span class="${statusClass(ticket.status)}">
                ${escapeHtml(
          ticket.status || "Registered"
        )}
              </span>
            </span>
          </div>


          <div class="detail-row">
            <span class="detail-label">
              Assigned Team
            </span>

            <span class="detail-value">
              ${ticket.assigned_team_id ??
          "Not assigned"
          }
            </span>
          </div>


          <div class="detail-row">
            <span class="detail-label">
              Assigned Agent
            </span>

            <span class="detail-value">
              ${ticket.assigned_agent_id ??
          "Not assigned"
          }
            </span>
          </div>


          <div class="detail-row">
            <span class="detail-label">
              Created
            </span>

            <span class="detail-value">
              ${formatDate(
            ticket.created_at
          )}
            </span>
          </div>


          <div class="detail-row">
            <span class="detail-label">
              Updated
            </span>

            <span class="detail-value">
              ${formatDate(
            ticket.updated_at
          )}
            </span>
          </div>

        </div>


        ${ticket.resolution_information
            ? `
              <div
                style="
                  margin-top:18px;
                  padding:14px;
                  background:#f8fafc;
                  border-radius:10px;
                "
              >
                <b>Resolution Information</b>

                <p style="margin-top:6px;color:#475569;">
                  ${escapeHtml(
              ticket.resolution_information
            )}
                </p>
              </div>
            `
            : ""
          }


        <div class="timeline">

          <h4
            style="
              font-family:'Outfit',sans-serif;
              color:#0f172a;
              margin-bottom:16px;
            "
          >
            Status Timeline
          </h4>


          ${STEPS.map(
            (step, index) => `

              <div class="t-step">

                <div
                  class="dot ${index < current
                ? "done"
                : index === current
                  ? "current"
                  : ""
              }"
                ></div>


                <div class="t-line">

                  <b>
                    ${step}
                  </b>

                  <small>
                    ${index < current
                ? "Completed"
                : index === current
                  ? "Current Stage"
                  : "Pending"
              }
                  </small>

                </div>

              </div>

            `
          ).join("")}

        </div>


        ${ticket.history &&
            ticket.history.length
            ? `
              <div style="margin-top:20px;">

                <h4
                  style="
                    font-family:'Outfit',sans-serif;
                    color:#0f172a;
                    margin-bottom:12px;
                  "
                >
                  Ticket History
                </h4>

                ${ticket.history.map(
              item => `

                    <div
                      style="
                        padding:10px 0;
                        border-bottom:1px solid #f1f5f9;
                      "
                    >

                      <b>
                        ${escapeHtml(
                item.new_status || "Updated"
              )}
                      </b>

                      <div
                        style="
                          color:#64748b;
                          font-size:0.75rem;
                          margin-top:3px;
                        "
                      >
                        ${formatDate(
                item.changed_at
              )}
                      </div>

                    </div>

                  `
            ).join("")}

              </div>
            `
            : ""
          }

      `;

      } catch (error) {

        console.error(
          "Ticket detail error:",
          error
        );


        box.innerHTML = `
        <h3>Ticket Details</h3>

        <p class="error-message">
          ❌ Unable to load ticket details.
        </p>
      `;

      }

    }


    /* ============================================
       SEARCH TICKET
    ============================================ */

    async function searchTicket() {

      const input =
        document.getElementById("searchId");

      const searchValue =
        input.value.trim().toUpperCase();


      if (!searchValue) {

        renderList(userTickets);

        if (userTickets.length) {
          showDetail(userTickets[0].id);
        }

        return;
      }


      /*
       * Search by REAL ticket number.
       *
       * Example:
       * TKT-10010
       * 10010
       */

      const found =
        userTickets.find(ticket => {

          const ticketNumber =
            String(
              ticket.ticket_number || ""
            ).toUpperCase();

          const databaseId =
            String(
              ticket.id || ""
            );

          return (
            ticketNumber === searchValue ||
            ticketNumber.includes(searchValue) ||
            databaseId === searchValue
          );

        });


      if (!found) {

        document.getElementById(
          "ticketList"
        ).innerHTML = `
        <div class="error-message">
          ❌ Ticket not found.
        </div>
      `;


        document.getElementById(
          "detailBox"
        ).innerHTML = `
        <h3>Ticket Details</h3>

        <p class="error-message">
          Ticket <b>${escapeHtml(searchValue)}</b>
          was not found in your tickets.
        </p>
      `;

        return;
      }


      renderList([found]);

      await showDetail(found.id);

    }


    /* ============================================
       LOAD TICKETS
    ============================================ */

    async function loadTickets() {

      const box =
        document.getElementById("ticketList");


      box.innerHTML = `
      <div class="loading">
        Loading your tickets...
      </div>
    `;


      try {

        const data =
          await getBackendTickets();


        userTickets =
          data.items || [];


        renderList(userTickets);


        if (userTickets.length) {

          showDetail(
            userTickets[0].id
          );

        } else {

          document.getElementById(
            "detailBox"
          ).innerHTML = `
          <h3>Ticket Details</h3>

          <div style="padding:20px;color:#64748b;">
            Abhi koi ticket registered nahi hai.
          </div>
        `;

        }

      } catch (error) {

        console.error(
          "Backend ticket loading error:",
          error
        );


        box.innerHTML = `
        <div class="error-message">
          ❌ Unable to load tickets from backend.
          <br>
          Please make sure you are logged in.
        </div>
      `;

      }

    }


    /* ============================================
       ENTER KEY SEARCH
    ============================================ */

    document
      .getElementById("searchId")
      .addEventListener(
        "keydown",
        function (event) {

          if (event.key === "Enter") {
            searchTicket();
          }

        }
      );


    /* ============================================
       INITIAL LOAD
    ============================================ */

    loadTickets();

  </script>

</body>
