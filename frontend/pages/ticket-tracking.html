<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Track Ticket | ComplaintCare</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
  <style>
    .track-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .track-grid { grid-template-columns: 1fr; } }
    .card-box { background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 2px 12px rgba(15,23,42,0.05); border: 1px solid #f1f5f9; }
    .search-row { display: flex; gap: 10px; margin-bottom: 16px; }
    .search-row input { flex: 1; padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 10px; outline: none; font-size: 0.9rem; }
    .search-row input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.15); }
    .search-row button { padding: 12px 20px; background: linear-gradient(135deg, #0f172a, #14325c); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .ticket-item { border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; background: #fff; }
    .ticket-item:hover, .ticket-item.active { border-color: #10b981; background: #f0fdf4; }
    .ticket-item h4 { font-family: 'Outfit', sans-serif; font-size: 0.95rem; color: #0f172a; margin-bottom: 4px; }
    .ticket-item p { font-size: 0.8rem; color: #64748b; }
    .timeline { margin-top: 20px; }
    .t-step { display: flex; gap: 14px; margin-bottom: 16px; align-items: flex-start; }
    .dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; background: #e2e8f0; }
    .dot.done { background: #10b981; }
    .dot.current { background: #0f172a; box-shadow: 0 0 0 4px rgba(16,185,129,0.2); }
    .t-line b { color: #0f172a; font-family: 'Outfit', sans-serif; font-size: 0.9rem; }
    .t-line small { color: #64748b; font-size: 0.75rem; }
  </style>
</head>
<body style="background: linear-gradient(180deg, #f8fafc, #f1f5f9); min-height: 100vh;">

<div style="display:flex; min-height:100vh;">
  <aside style="width:260px; background: linear-gradient(135deg,#0f172a,#14325c); color:#fff; padding: 28px 0; position:fixed; left:0; top:0; bottom:0; z-index:200; box-shadow: 4px 0 20px rgba(15,23,42,0.08);">
    <div style="padding: 0 24px 28px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px; display:flex; align-items:center; gap:10px;">
      <img src="../assets/images/logo.png" alt="Logo" style="width:36px;height:36px;border-radius:8px;" onerror="this.style.display='none';this.nextElementSibling.innerText='🎫';" />
      <span style="font-family:'Outfit',sans-serif; font-weight:800; font-size:1.15rem; color:#fff;">Complaint<span style="color:#34d399;">Care</span></span>
    </div>
    <ul style="list-style:none; padding: 0;">
      <li><a href="user-dashboard.html" style="display:flex; align-items:center; gap:12px; padding:12px 24px; color:rgba(255,255,255,0.7); text-decoration:none; font-size:0.9rem; font-weight:600; border-radius:10px; margin: 2px 12px;"><span>📊</span> Dashboard</a></li>
      <li><a href="complaint.html" style="display:flex; align-items:center; gap:12px; padding:12px 24px; color:rgba(255,255,255,0.7); text-decoration:none; font-size:0.9rem; font-weight:600; border-radius:10px; margin: 2px 12px;"><span>📝</span> Log Complaint</a></li>
      <li><a href="ticket-tracking.html" style="display:flex; align-items:center; gap:12px; padding:12px 24px; color:#fff; text-decoration:none; font-size:0.9rem; font-weight:700; background:rgba(255,255,255,0.08); border-radius:10px; margin: 2px 12px;"><span>📍</span> Track Ticket</a></li>
      <li><a href="notifications.html" style="display:flex; align-items:center; gap:12px; padding:12px 24px; color:rgba(255,255,255,0.7); text-decoration:none; font-size:0.9rem; font-weight:600; border-radius:10px; margin: 2px 12px;"><span>🔔</span> Notifications</a></li>
      <li><a href="profile.html" style="display:flex; align-items:center; gap:12px; padding:12px 24px; color:rgba(255,255,255,0.7); text-decoration:none; font-size:0.9rem; font-weight:600; border-radius:10px; margin: 2px 12px;"><span>👤</span> Profile</a></li>
    </ul>
    <div style="padding: 16px 20px;">
      <button onclick="logout()" style="width:100%; padding:12px; background:rgba(239,68,68,0.15); color:#f87171; border:1px solid rgba(239,68,68,0.25); border-radius:10px; font-weight:700; cursor:pointer;">🚪 Logout</button>
    </div>
  </aside>

  <div style="margin-left:260px; flex:1;">
    <div style="background:rgba(255,255,255,0.9); backdrop-filter:blur(12px); padding:18px 32px; border-bottom:1px solid #e2e8f0; position:sticky; top:0; z-index:50; display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h2 style="font-family:'Outfit',sans-serif; color:#0f172a; font-size:1.2rem;">📍 Track Ticket</h2>
        <p style="color:#64748b; font-size:0.85rem;">Ticket ID se search karo ya list se select karo</p>
      </div>
      <a href="notifications.html" style="position:relative; width:42px; height:42px; background:#f1f5f9; border-radius:12px; display:flex; align-items:center; justify-content:center; text-decoration:none;">
        🔔 <span id="notif-count" style="position:absolute; top:-4px; right:-4px; background:#ef4444; color:#fff; font-size:0.65rem; font-weight:800; width:18px; height:18px; border-radius:50%;">0</span>
      </a>
    </div>

    <div style="padding:32px;">
      <div class="track-grid">
        <!-- Left: Search + List -->
        <div class="card-box">
          <div class="search-row">
            <input id="searchId" placeholder="Ticket ID (e.g. 1001)" />
            <button onclick="searchTicket()">Track</button>
          </div>
          <div id="ticketList"></div>
        </div>

        <!-- Right: Detail -->
        <div class="card-box" id="detailBox">
          <h3 style="font-family:'Outfit',sans-serif; color:#0f172a; margin-bottom:14px;">Ticket Details</h3>
          <div style="padding:20px; color:#64748b;">Koi ticket select karo ya ID daal ke Track dabao.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/chatbot.js"></script>
<script src="../assets/js/tickets.js"></script>

<script>
  const user = checkAuth();
  if (!user) window.location.href = "login.html";

  const STEPS = ["Registered", "In Progress", "Under Review", "Resolved"];

  function renderList(list) {
    const box = document.getElementById("ticketList");
    if (!list || list.length === 0) {
      box.innerHTML = '<div style="padding:20px;color:#64748b;">No tickets found.</div>';
      return;
    }
    box.innerHTML = list.map(t => `
      <div class="ticket-item" onclick="showDetail(${t.id})">
        <h4>#${t.id} — ${(t.subject||"No subject").substring(0,40)}</h4>
        <p>
          <span class="badge ${priorityClass(t.priority||"Medium")}">${t.priority||"Medium"}</span>
          <span class="badge ${statusClass(t.status||"Registered")}">${t.status||"Registered"}</span>
          &nbsp; ${t.category||"General"} • ${formatDate(t.createdAt||new Date())}
        </p>
      </div>
    `).join("");
  }

  function statusStep(status) {
    const order = ["Registered","In Progress","Under Review","Resolved"];
    return order.indexOf(status) === -1 ? 0 : order.indexOf(status);
  }

  function showDetail(id) {
    const t = getTicketById(id);
    const box = document.getElementById("detailBox");
    if (!t) {
      box.innerHTML = '<h3>Ticket Details</h3><p style="color:#ef4444;">Ticket not found.</p>';
      return;
    }
    const current = statusStep(t.status || "Registered");
    box.innerHTML = `
      <h3 style="font-family:'Outfit',sans-serif;color:#0f172a;margin-bottom:6px;">Ticket #${t.id}</h3>
      <p style="color:#475569;margin-bottom:14px;">${t.subject||"No subject"}</p>
      <p style="color:#334155;margin-bottom:16px;">${t.description || t.subject || "No description available."}</p>
      <div style="display:flex;gap:10px;margin-bottom:16px;">
        <span style="background:#f1f5f9;padding:4px 12px;border-radius:50px;font-size:0.8rem;font-weight:600;color:#475569;">${t.category||"General"}</span>
        <span class="badge ${priorityClass(t.priority)}">${t.priority||"Medium"}</span>
        <span class="badge ${statusClass(t.status)}">${t.status||"Registered"}</span>
      </div>
      <p style="font-size:0.85rem;color:#475569;margin-bottom:6px;">Assigned: <b style="color:#0f172a;">${t.assignedTo||"Unassigned"}</b></p>
      <p style="font-size:0.85rem;color:#475569;margin-bottom:20px;">Created: ${formatDate(t.createdAt||new Date())}</p>

      <h4 style="font-family:'Outfit',sans-serif;color:#0f172a;margin-bottom:14px;">Status Timeline</h4>
      <div style="display:flex;flex-direction:column;gap:14px;">
        ${STEPS.map((s, i) => `
          <div style="display:flex;gap:14px;align-items:center;">
            <div style="width:18px;height:18px;border-radius:50%;flex-shrink:0;background:${i < current ? "#10b981" : (i === current ? "#0f172a" : "#cbd5e1")};box-shadow:${i===current ? "0 0 0 4px rgba(16,185,129,0.2)" : "none"};"></div>
            <div>
              <div style="font-weight:700;color:#0f172a;">${s}</div>
              <div style="font-size:0.75rem;color:#64748b;">${i < current ? "Completed" : (i === current ? "Current Stage" : "Pending")}</div>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  }

  function searchTicket() {
    const id = document.getElementById("searchId").value.trim();
    if (!id) {
      const userTickets = getTickets().filter(t => t.userId === user.id || t.userEmail === user.email);
      renderList(userTickets.length ? userTickets : []);
      return;
    }
    const t = getTicketById(id);
    renderList(t ? [t] : []);
    if (t) showDetail(t.id);
    else document.getElementById("detailBox").innerHTML = '<h3>Ticket Details</h3><p style="color:#ef4444;">Ticket not found.</p>';
  }

  document.getElementById("searchId").addEventListener("keypress", function(e) {
    if (e.key === "Enter") searchTicket();
  });

  // Show user's own tickets by default
  const myTickets = getTickets().filter(t => t.userId === user.id || t.userEmail === user.email);
  renderList(myTickets);
  if (myTickets.length) showDetail(myTickets[0].id);
</script>

</body>
</html>
