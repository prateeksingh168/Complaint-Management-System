<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — ComplaintCare</title>
  <link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="logo-icon">🎫</div>
        <span>Complaint<span class="green">Care</span></span>
      </div>

      <h2>Create Account ✨</h2>
      <p class="auth-subtitle">Join to manage and resolve complaints faster</p>

      <div id="reg-message" class="message"></div>

      <form id="registerForm">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="Your full name" required autocomplete="name" />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="regPhone" placeholder="10-digit mobile number" maxlength="10" required autocomplete="tel" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" placeholder="Minimum 6 characters" required autocomplete="new-password" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="regConfirm" placeholder="Re-enter password" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn-full">Create Account</button>
      </form>

      <p class="auth-switch">
        Already registered? <a href="login.html">Login here</a> &nbsp;|&nbsp; <a href="../index.html">← Home</a>
      </p>
    </div>
  </div>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
