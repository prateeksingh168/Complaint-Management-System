<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — ComplaintCare</title>
  <link rel="stylesheet" href="../assets/css/auth.css" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
  <style>
    /* Profile Page Fix: Clean white card on dark sidebar layout */
    .profile-wrap { max-width: 520px; padding-top: 20px; }
    .profile-card { background: #fff; border-radius: 24px; padding: 36px; box-shadow: 0 20px 50px rgba(15,23,42,0.08); border: 1px solid #e2e8f0; }
    .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid #f1f5f9; }
    .profile-avatar-large { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #0f172a, #059669); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.4rem; box-shadow: 0 8px 24px rgba(5,150,105,0.2); }
    .profile-header h3 { font-family: 'Outfit', sans-serif; font-size: 1.2rem; color: #0f172a; letter-spacing: -0.5px; margin-bottom: 2px; }
    .profile-header span { font-size: 0.82rem; color: #64748b; }
    .message.show { display: block; margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="dashboard-wrapper">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div style="display:flex;align-items:center;gap:10px;">
        <img src="../assets/images/logo.png" alt="Logo" style="width:36px;height:36px;border-radius:10px;object-fit:contain;" onerror="this.style.display='none';" />
        <span style="font-family:'Outfit',sans-serif;font-weight:700;font-size:1.15rem;color:#fff;letter-spacing:-0.5px;">Complaint<span style="color:#34d399;">Care</span></span>
      </div>
    </div>
    <ul class="sidebar-menu">
      <li><a href="user-dashboard.html"><span>📊</span> Dashboard</a></li>
      <li><a href="complaint.html"><span>📝</span> Log Complaint</a></li>
      <li><a href="ticket-tracking.html"><span>📍</span> Track Ticket</a></li>
      <li><a href="notifications.html"><span>🔔</span> Notifications</a></li>
      <li><a href="profile.html" class="active"><span>👤</span> Profile</a></li>
    </ul>
    <div class="sidebar-logout"><button onclick="logout()">🚪 Logout</button></div>
  </aside>

  <div class="main-content">
    <div class="topbar" style="background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;">
      <div class="topbar-left">
        <h2>👤 My Profile</h2>
        <p>Account details update karo</p>
      </div>
    </div>

    <div class="dashboard-body" style="padding-top:20px;">
      <div class="profile-wrap">
        <div class="profile-card">

          <div class="profile-header">
            <div class="profile-avatar-large" id="avatar-big">U</div>
            <div>
              <h3 id="profile-display-name">User</h3>
              <span>Member since account creation</span>
            </div>
          </div>

          <div id="msg" class="message"></div>

          <form id="profileForm">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="name" required placeholder="Your full name" />
            </div>
            <div class="form-group">
              <label>Email (read only)</label>
              <input type="email" id="email" readonly style="background:#f1f5f9;color:#475569;" />
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input type="tel" id="phone" maxlength="10" required placeholder="10 digit number" />
            </div>
            <div class="form-group">
              <label>New Password (optional)</label>
              <input type="password" id="password" placeholder="Leave blank if no change" />
            </div>
            <button type="submit" class="btn-full" style="background:linear-gradient(135deg,#0f172a,#059669);">Save Changes</button>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/js/app.js"></script>
<script>
  const user = checkAuth();
  if (user) {
    document.getElementById("name").value = user.name || "";
    document.getElementById("email").value = user.email || "";
    document.getElementById("phone").value = user.phone || "";
    document.getElementById("profile-display-name").textContent = user.name || "User";
    document.getElementById("avatar-big").textContent = (user.name || "U").charAt(0).toUpperCase();
  }

  document.getElementById("profileForm").addEventListener("submit", function(e){
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const password = document.getElementById("password").value.trim();
    const msg = document.getElementById("msg");

    if(name.length < 3){ msg.className="message error show"; msg.textContent="Name kam se kam 3 letters"; return; }
    if(!/^\d{10}$/.test(phone)){ msg.className="message error show"; msg.textContent="Phone exactly 10 digits"; return; }
    if(password && password.length < 6){ msg.className="message error show"; msg.textContent="Password min 6 chars"; return; }

    const users = getUsers();
    const idx = users.findIndex(u => u.id === user.id);
    if(idx >= 0){
      users[idx].name = name; users[idx].phone = phone; if(password) users[idx].password = password;
      saveUsers(users); localStorage.setItem(SESSION_KEY, JSON.stringify(users[idx]));
    }

    msg.className="message success show";
    msg.textContent = "Profile updated successfully ✅";
    document.getElementById("password").value = "";
    document.getElementById("avatar-big").textContent = name.charAt(0).toUpperCase();
    document.getElementById("profile-display-name").textContent = name;
  });
</script>

</body>
</html>
