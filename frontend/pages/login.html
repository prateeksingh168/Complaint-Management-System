<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ComplaintCare</title>
  <link rel="stylesheet" href="../assets/css/auth.css" />
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-logo">
        <img src="../assets/images/logo.png" alt="Logo" style="width:38px;height:38px;border-radius:8px;" onerror="this.style.display='none';this.nextElementSibling.innerHTML='<span style=\'font-size:1.4rem;\'>🎫</span>';"/>
        <span>Complaint<span class="green">Care</span></span>
      </div>

      <h2>Welcome Back 👋</h2>
      <p class="auth-subtitle">Login to track and manage your complaints</p>

      <div id="login-message" class="message"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required />
        </div>
        <button type="submit" class="btn-full">Login</button>
      </form>

      <div class="demo-box">
        <p><b>🔑 Demo Admin:</b></p>
        <p>Email: <code>admin@cms.com</code> | Password: <code>admin123</code></p>
      </div>

      <p class="auth-switch">
        New here? <a href="register.html">Create account</a> &nbsp;|&nbsp; <a href="../index.html">← Home</a>
      </p>
    </div>
  </div>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
