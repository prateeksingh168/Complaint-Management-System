<div class="chatbot-window open" id="chatbot-popup">
  <div class="chatbot-header">
    <h4>🤖 ComplaintCare AI</h4>
    <button onclick="this.closest('.chatbot-window').classList.remove('open')">✕</button>
  </div>
  <div class="chatbot-body" id="popup-body">
    <div class="chat-msg bot">Hello! Describe your complaint.</div>
  </div>
  <div class="chatbot-input">
    <input type="text" placeholder="Type here..." id="popup-input" />
    <button onclick="sendPopupMsg()">➤</button>
  </div>
</div>
