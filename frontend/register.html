<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign Up | ComplaintCare</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div class="card" style="width: 100%; max-width: 440px;">
    <h2 style="color:var(--primary); text-align:center; margin-bottom:0.5rem;">Create Account</h2>
    <p style="color:var(--slate); text-align:center; margin-bottom:1.5rem; font-size:0.9rem;">Register to file & track complaints</p>
    
    <form onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Register As</label>
        <select id="regRole" class="form-control">
          <option value="user">User / Citizen</option>
          <option value="admin">Administrator</option>
        </select>
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" class="form-control" placeholder="Rahul Sharma" required />
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPass" class="form-control" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
    </form>

    <p style="text-align:center; margin-top:1.2rem; font-size:0.85rem; color:var(--slate);">
      Already have an account? <a href="login.html" style="color:var(--primary);">Sign In</a>
    </p>
  </div>

  <script src="js/app.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const role = new URLSearchParams(window.location.search).get("role");
      if (role === "admin") {
        document.getElementById("regRole").value = "admin";
      }
    });

    function handleRegister(e) {
      e.preventDefault();
      const user = {
        name: document.getElementById("regName").value,
        email: document.getElementById("regEmail").value,
        role: document.getElementById("regRole").value
      };
      localStorage.setItem("cms_current_user", JSON.stringify(user));
      alert("Registration Successful!");
      if (user.role === "admin") {
        window.location.href = "admin-dashboard.html";
      } else {
        window.location.href = "user-dashboard.html";
      }
    }
  </script>
</body>
</html>
